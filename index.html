<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Dashbox — dashboard manajemen RouterOS untuk PPP, Hotspot, dan monitoring."
    />
    <meta name="theme-color" content="#0a0e1a" />
    <title>Dashbox · Manajer Router</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('dashbox.theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark =
            stored === 'dark' || (!stored && prefersDark) || (stored === 'system' && prefersDark);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#f5f7fb');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body
    class="bg-background font-body text-on-surface antialiased flex flex-col min-h-screen selection:bg-primary/25 selection:text-primary"
  >
    <a
      href="#main-content"
      style="
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border-width: 0;
      "
      class="sr-only focus:not-sr-only focus:fixed focus:left-3 focus:top-3 focus:z-[200] focus:rounded-lg focus:bg-primary focus:px-3 focus:py-2 focus:text-xs focus:font-bold focus:text-on-primary"
    >
      Lewati ke konten utama
    </a>
    <div id="app" class="flex flex-col min-h-screen"></div>
    <noscript>
      <div class="p-6 text-center text-sm text-on-surface-variant">
        Dashbox membutuhkan JavaScript untuk berjalan.
      </div>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
